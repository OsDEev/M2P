name: pc-port

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # NOTE: the port is 32-bit x86 (game structs assume 4-byte
      # pointers), so Windows uses -A Win32 and Linux uses -m32 multilib.
      matrix:
        include:
          - os: windows-latest
            compiler: msvc
            configure_flags: "-A Win32"
          - os: windows-latest
            compiler: no-imgui
            configure_flags: "-A Win32 -DMELEE_WANT_IMGUI=OFF"
          - os: ubuntu-latest
            compiler: gcc-m32
            configure_flags: ""
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install Linux deps
      if: runner.os == 'Linux'
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y gcc-multilib g++-multilib \
          libgl1-mesa-dev:i386 \
          libx11-dev:i386 libxrandr-dev:i386 libxinerama-dev:i386 \
          libxcursor-dev:i386 libxi-dev:i386

    - name: Configure
      run: >
        cmake -S . -B build_pc -DCMAKE_BUILD_TYPE=Release
        ${{ matrix.configure_flags }}

    - name: Build
      run: cmake --build build_pc --config Release --parallel

    - name: Smoke test (--help)
      # --help exits before video init, so no display is needed.
      run: ./build_pc/bin/melee_pc --help
      shell: bash
