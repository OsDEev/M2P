name: pc-port

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # NOTE: the port is 32-bit x86 (game structs assume 4-byte
      # pointers), so Windows uses -A Win32 and Linux uses -m32 multilib.
      matrix:
        include:
          - os: windows-latest
            compiler: msvc
            configure_flags: "-A Win32"
          - os: windows-latest
            compiler: no-imgui
            configure_flags: "-A Win32 -DMELEE_WANT_IMGUI=OFF"
          - os: ubuntu-latest
            compiler: gcc-m32
            configure_flags: ""
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install Linux deps
      if: runner.os == 'Linux'
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y gcc-multilib g++-multilib \
          libgl1-mesa-dev:i386 \
          libx11-dev:i386 libxrandr-dev:i386 libxinerama-dev:i386 \
          libxcursor-dev:i386 libxi-dev:i386

    - name: Configure
      run: >
        cmake -S . -B build_pc -DCMAKE_BUILD_TYPE=Release
        -DOpenGL_GL_PREFERENCE=LEGACY -DOPENGL_GL_PREFERENCE=LEGACY
        ${{ matrix.configure_flags }}

    - name: Build
      # NOTE: --parallel is bounded (unbounded -j OOM-kills 32-bit cc1
      # jobs on hosted runners). The log is kept so failures can dump
      # errors into the step summary below.
      run: |
        cmake --build build_pc --config Release --parallel 4 2>&1 | tee build_pc/build.log
        exit ${PIPESTATUS[0]}
      shell: bash

    - name: Build errors (summary)
      # NOTE: step summaries/logs need a login to view; ::error::
      # annotations are also readable via the public Checks API, so emit
      # the first errors there too (workflow-command escaping applied).
      if: failure()
      run: |
        set +e
        echo '## Build errors (first 30)' >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        grep -E -i -m 30 'error|undefined reference' build_pc/build.log >> "$GITHUB_STEP_SUMMARY" || true
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        CTX=$(grep -E -i -A3 -m 30 '\berror\b' build_pc/build.log | head -120 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | paste -sd ' // ' -)
        if [ -n "$CTX" ]; then echo "::error::$CTX"; fi
        OBJS=$(grep -oP 'CMakeFiles/\S+\.o(?=.*Error)|(?<=Failed to build ).*\.o' build_pc/build.log | sort -u | head -20 | paste -sd ' // ' -)
        if [ -n "$OBJS" ]; then echo "::error::failing objects: $OBJS"; fi
      shell: bash

    - name: Smoke test (--help)
      # --help exits before video init, so no display is needed.
      # NOTE: Visual Studio is multi-config: the exe lands in
      # bin/Release/, while single-config generators use bin/.
      run: |
        if [ -x ./build_pc/bin/melee_pc ]; then
          ./build_pc/bin/melee_pc --help
        else
          ./build_pc/bin/Release/melee_pc.exe --help
        fi
      shell: bash

    - name: Upload exe (Windows)
      # Lets users grab a fresh build without a toolchain: Actions page
      # -> this run -> Artifacts. Needs no login to list; download
      # requires a free GitHub account.
      if: runner.os == 'Windows' && success()
      uses: actions/upload-artifact@v4
      with:
        name: melee_pc-${{ matrix.compiler }}-win32
        path: |
          build_pc/bin/Release/melee_pc.exe
          build_pc/bin/Release/melee_romextract.exe
        if-no-files-found: error
        retention-days: 14
